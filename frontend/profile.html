<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My profile · CivicEvents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/notifications.js"></script>
    <script src="js/core/layout.js"></script>
    <script src="js/core/components.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-gray-50 font-sans text-gray-900" data-page="profile" data-auth="required">
    <div id="app-header"></div>

    <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">My profile</h1>
        <p class="mt-1 text-gray-600">Your account details and activity.</p>

        <div class="mt-6 grid gap-6 lg:grid-cols-3">
            <section id="profile-card" class="card p-6" aria-labelledby="pc-h" aria-busy="true"></section>

            <section class="card p-6 lg:col-span-2" aria-labelledby="edit-h">
                <h2 id="edit-h" class="text-lg font-semibold">Edit details</h2>
                <form id="profile-form" class="mt-4 space-y-4" novalidate>
                    <div class="field">
                        <label for="full_name" class="label">Full name</label>
                        <input id="full_name" type="text" autocomplete="name" required class="input">
                    </div>
                    <div class="field">
                        <label for="email" class="label">Email address</label>
                        <input id="email" type="email" autocomplete="email" required class="input" aria-describedby="email-hint">
                        <p id="email-hint" class="hint">You use this to log in. We'll ask you to confirm before changing it.</p>
                    </div>
                    <!-- Role and account status are display-only: the API rejects changes to them -->
                    <div class="grid gap-4 sm:grid-cols-2">
                        <div class="field">
                            <label for="role" class="label">Role</label>
                            <input id="role" type="text" disabled class="input !bg-gray-100 !text-gray-600" aria-describedby="locked-hint">
                        </div>
                        <div class="field">
                            <label for="is_active" class="label">Account status</label>
                            <input id="is_active" type="text" disabled class="input !bg-gray-100 !text-gray-600" aria-describedby="locked-hint">
                        </div>
                    </div>
                    <p id="locked-hint" class="hint">Role and status can only be managed by the city's system administrators.</p>
                    <div id="form-alert" class="hidden"></div>
                    <div class="flex justify-end gap-3 border-t pt-4">
                        <button type="reset" class="btn-secondary">Undo changes</button>
                        <button type="submit" id="save-btn" class="btn-primary">Save changes</button>
                    </div>
                </form>
            </section>
        </div>

        <section class="mt-6" aria-labelledby="act-h">
            <h2 id="act-h" class="text-lg font-semibold">My activity</h2>
            <div id="my-stats" class="mt-3 grid grid-cols-2 gap-4 md:grid-cols-4"></div>
        </section>
    </main>

    <div id="app-footer"></div>
    <script src="js/pages/profile.js"></script>
</body>
</html>
