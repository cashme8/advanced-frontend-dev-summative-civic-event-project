<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event editor · CivicEvents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/notifications.js"></script>
    <script src="js/core/layout.js"></script>
    <script src="js/core/components.js"></script>
</head>
<!-- ADMIN-ONLY PAGE: data-role="admin" makes Auth.guard() show a 403 view to normal users -->
<body class="flex min-h-screen flex-col bg-gray-50 font-sans text-gray-900" data-page="event-form" data-auth="required" data-role="admin" data-layout="admin">
    <div id="app-header"></div>

    <main id="main" class="flex-1">
        <div class="mb-6">
            <a href="events.html" class="text-sm text-civic-700 hover:underline">← Back to events</a>
            <h1 id="form-title" class="mt-2 text-2xl font-bold text-gray-900">Create event</h1>
            <p class="text-gray-600">Fields marked * are required. Residents are notified when a new event is created.</p>
        </div>

        <form id="event-form" class="card grid gap-5 p-6 lg:grid-cols-5" novalidate>
            <div class="space-y-5 lg:col-span-3">
                <div class="field">
                    <label for="title" class="label">Title *</label>
                    <input id="title" name="title" type="text" maxlength="150" required class="input" placeholder="e.g. Community Clean-Up Day">
                </div>
                <div class="field">
                    <label for="description" class="label">Description</label>
                    <textarea id="description" name="description" rows="5" maxlength="3000" class="input" placeholder="What will happen, who it's for, what to bring…"></textarea>
                    <p class="hint"><span id="desc-count">0</span>/3000 characters</p>
                </div>
                <div class="field">
                    <label for="location" class="label">Location *</label>
                    <input id="location" name="location" type="text" required class="input" placeholder="e.g. Central Park">
                </div>
                <div class="grid gap-5 sm:grid-cols-2">
                    <div class="field">
                        <label for="starts_at" class="label">Starts *</label>
                        <input id="starts_at" name="starts_at" type="datetime-local" required class="input">
                    </div>
                    <div class="field">
                        <label for="ends_at" class="label">Ends *</label>
                        <input id="ends_at" name="ends_at" type="datetime-local" required class="input">
                    </div>
                </div>
                <div class="flex items-center justify-between rounded-lg border border-gray-200 p-4">
                    <div>
                        <p id="pub-label" class="font-semibold text-gray-900">Published</p>
                        <p id="pub-hint" class="text-sm text-gray-600">Published events are visible to all residents.</p>
                    </div>
                    <span class="switch"><input id="published" name="published" type="checkbox" role="switch" checked aria-labelledby="pub-label" aria-describedby="pub-hint"><span class="track"></span></span>
                </div>
            </div>

            <div class="space-y-3 lg:col-span-2">
                <p class="label" id="img-label">Event image</p>
                <div class="dropzone p-4" data-kind="image">
                    <div id="img-preview" class="mb-3 flex h-48 items-center justify-center overflow-hidden rounded-lg bg-gray-100 text-gray-400">
                        <span class="text-sm">No image selected</span>
                    </div>
                    <div class="field text-center">
                        <label for="image" class="btn-secondary cursor-pointer">Choose image</label>
                        <input id="image" name="image" type="file" accept=".jpg,.jpeg,.png,.gif,image/jpeg,image/png,image/gif" class="sr-only" aria-describedby="img-hint">
                        <p class="mt-2 text-sm text-gray-600" data-file-info>or drag & drop here</p>
                        <p id="img-hint" class="hint">JPG, PNG or GIF · max 2 MB</p>
                    </div>
                </div>
                <button type="button" id="remove-img" class="btn-ghost hidden text-sm">Remove selected image</button>
                <div id="upload-progress" class="hidden"></div>
            </div>

            <div id="form-alert" class="hidden lg:col-span-5"></div>
            <div class="flex flex-wrap justify-end gap-3 border-t pt-5 lg:col-span-5">
                <a href="events.html" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary" id="submit-btn">Create event</button>
            </div>
        </form>
    </main>

    <div id="app-footer"></div>
    <script src="js/pages/event-form.js"></script>
</body>
</html>
