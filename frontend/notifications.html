<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications · CivicEvents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/notifications.js"></script>
    <script src="js/core/layout.js"></script>
    <script src="js/core/components.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-gray-50 font-sans text-gray-900" data-page="notifications" data-auth="required">
    <div id="app-header"></div>

    <main id="main" class="mx-auto w-full max-w-7xl flex-1 px-4 py-8">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gray-900">Notifications</h1>
                <p class="mt-1 text-gray-600">City-wide broadcasts and messages meant for you.</p>
            </div>
            <div class="flex gap-2">
                <button type="button" id="inbox-mark-all" class="btn-secondary">Mark all read</button>
                <button type="button" id="inbox-refresh" class="btn-secondary" aria-label="Refresh notifications"></button>
            </div>
        </div>

        <div class="mt-6 flex flex-wrap items-center gap-2" role="group" aria-label="Filter notifications">
            <button type="button" class="filter-chip" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter-chip" data-filter="unread" aria-pressed="false">Unread</button>
            <button type="button" class="filter-chip" data-filter="event" aria-pressed="false">Events</button>
            <button type="button" class="filter-chip" data-filter="announcement" aria-pressed="false">Announcements</button>
            <button type="button" class="filter-chip" data-filter="promo" aria-pressed="false">Promos</button>
        </div>

        <div class="mt-4 grid gap-6 lg:grid-cols-5">
            <section class="card overflow-hidden lg:col-span-2" aria-label="Notification list">
                <div id="inbox-list" class="divide-y" aria-busy="true"></div>
            </section>
            <section id="inbox-detail" class="card p-6 lg:col-span-3" aria-live="polite" tabindex="-1" aria-label="Notification detail"></section>
        </div>
    </main>

    <div id="app-footer"></div>
    <script src="js/pages/notifications.js"></script>
</body>
</html>
