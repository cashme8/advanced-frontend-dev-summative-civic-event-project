<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up · CivicEvents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/notifications.js"></script>
    <script src="js/core/layout.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-gradient-to-br from-civic-50 via-white to-leaf-50 font-sans text-gray-900" data-page="signup" data-auth="guest">
    <div id="app-header"></div>

    <main id="main" class="flex flex-1 items-center justify-center px-4 py-12">
        <section class="card w-full max-w-md p-8 fade-in" aria-labelledby="signup-title">
            <h1 id="signup-title" class="text-2xl font-bold text-gray-900">Create your account</h1>
            <p class="mt-1 text-sm text-gray-600">Join CivicEvents to register for city events and get updates.</p>

            <div id="form-alert" class="mt-4 hidden"></div>

            <form id="signup-form" class="mt-6 space-y-4" novalidate>
                <div class="field">
                    <label for="full_name" class="label">Full name</label>
                    <input id="full_name" name="full_name" type="text" autocomplete="name" required class="input" placeholder="e.g. Jane Uwase">
                </div>
                <div class="field">
                    <label for="email" class="label">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required class="input" placeholder="you@example.com">
                </div>
                <div class="field">
                    <label for="password" class="label">Password</label>
                    <div class="relative">
                        <input id="password" name="password" type="password" autocomplete="new-password" required class="input pr-11" aria-describedby="pw-rules">
                        <button type="button" class="pw-toggle absolute inset-y-0 right-0 flex items-center px-3 text-gray-600 hover:text-civic-700" aria-label="Show password" aria-pressed="false" data-target="password"></button>
                    </div>
                    <!-- Password strength meter -->
                    <div class="mt-2" aria-live="polite">
                        <div class="flex gap-1" aria-hidden="true">
                            <span class="pw-bar h-1.5 flex-1 rounded-full bg-gray-200"></span>
                            <span class="pw-bar h-1.5 flex-1 rounded-full bg-gray-200"></span>
                            <span class="pw-bar h-1.5 flex-1 rounded-full bg-gray-200"></span>
                            <span class="pw-bar h-1.5 flex-1 rounded-full bg-gray-200"></span>
                            <span class="pw-bar h-1.5 flex-1 rounded-full bg-gray-200"></span>
                        </div>
                        <p id="pw-label" class="mt-1 text-xs font-semibold text-gray-600">Password strength: —</p>
                    </div>
                    <ul id="pw-rules" class="mt-2 grid grid-cols-1 gap-1 text-xs text-gray-600 sm:grid-cols-2">
                        <li data-rule="length">At least 8 characters</li>
                        <li data-rule="upper">An uppercase letter</li>
                        <li data-rule="lower">A lowercase letter</li>
                        <li data-rule="number">A number</li>
                        <li data-rule="special">A special character (!@#…)</li>
                    </ul>
                </div>
                <div class="field">
                    <label for="confirm_password" class="label">Confirm password</label>
                    <div class="relative">
                        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required class="input pr-11">
                        <button type="button" class="pw-toggle absolute inset-y-0 right-0 flex items-center px-3 text-gray-600 hover:text-civic-700" aria-label="Show password" aria-pressed="false" data-target="confirm_password"></button>
                    </div>
                </div>
                <button type="submit" class="btn-primary w-full !py-3">Create account</button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-600">Already have an account? <a href="login.html" class="font-semibold text-civic-700 hover:underline">Log in</a></p>
        </section>
    </main>

    <div id="app-footer"></div>
    <script src="js/pages/auth.js"></script>
</body>
</html>
